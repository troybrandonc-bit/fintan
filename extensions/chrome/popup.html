<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 300px; margin: 14px; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; border: 1px solid #ccc; border-radius: 4px; }
  button { width: 100%; padding: 8px; margin-top: 10px; border: 0; border-radius: 4px; background: #1a1a1a; color: #fff; cursor: pointer; }
  button.secondary { background: #e8e8e8; color: #1a1a1a; }
  #msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  details { margin-top: 12px; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <h1>Teach Fintan this page</h1>
  <label>Learn it as
    <select id="kind">
      <option value="documents">a document</option>
      <option value="news">news</option>
      <option value="personal">something about me</option>
    </select>
  </label>
  <button id="teach">Teach this page</button>
  <button id="learn" class="secondary">Learn now</button>
  <div id="msg"></div>
  <details>
    <summary>Settings</summary>
    <label>Your Fintan's address <input id="url" placeholder="http://127.0.0.1:8900"></label>
    <label>API key (if your Fintan has one) <input id="key" type="password"></label>
    <button id="save" class="secondary">Save</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
