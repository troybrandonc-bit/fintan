name: docker image

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Make room (the CUDA image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fintan:latest
            ghcr.io/${{ github.repository_owner }}/fintan:${{ github.sha }}
